# Pushing a version tag (git tag v1.2.0 && git push origin v1.2.0) tests Hop, builds
# Hop.app with that version, and publishes it as a GitHub Release.
#
# With the signing secrets set (README: Signed releases), the app is signed with the
# Developer ID certificate, notarized by Apple and stapled, so it opens on any Mac
# without a warning. Without them it's signed ad hoc, as before.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SIGNED: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.NOTARY_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: make test

      - name: Set the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist

      # A keychain of its own, deleted at the end, holding just the Developer ID
      # certificate and Apple's Developer ID intermediate it chains to.
      - name: Import the Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Add it to the search list, keeping the existing ones (paths without spaces).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::The DEVELOPER_ID_P12 secret has no Developer ID Application certificate in it."; exit 1; }

      - name: Build, sign and notarize Hop.app
        if: env.SIGNED == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          make notarized NOTARY_KEY="$RUNNER_TEMP/notary.p8" NOTARY_KEY_ID="$NOTARY_KEY_ID" NOTARY_ISSUER="$NOTARY_ISSUER"
          mv ~/Library/Caches/Hop/Hop.zip "Hop-$VERSION.zip"

      - name: Build Hop.app (ad hoc)
        if: env.SIGNED != 'true'
        run: |
          make dist
          mv ~/Library/Caches/Hop/Hop.zip "Hop-$VERSION.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            cat > notes.md <<NOTES
          Download **Hop-$VERSION.zip**, unzip it and move **Hop.app** to Applications.
          It's signed with a Developer ID and notarized by Apple, so it opens like any other app.
          Ask Claude needs [Claude Code](https://claude.com/claude-code) installed and signed in.
          NOTES
          else
            cat > notes.md <<NOTES
          Download **Hop-$VERSION.zip**, unzip it and move **Hop.app** to Applications.

          This build is signed ad hoc, not notarized, so macOS blocks it the first time:
          Control-click Hop.app, choose **Open**, then **Open** again. Or clear the
          download flag in Terminal: \`xattr -dr com.apple.quarantine /Applications/Hop.app\`.
          Ask Claude needs [Claude Code](https://claude.com/claude-code) installed and signed in.
          NOTES
          fi
          gh release create "$GITHUB_REF_NAME" "Hop-$VERSION.zip" \
            --title "Hop $VERSION" --notes-file notes.md --generate-notes --verify-tag

      - name: Remove the signing keychain and key
        if: always() && env.KEYCHAIN != ''
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8"
